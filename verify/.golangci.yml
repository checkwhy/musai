version: "2"

linters:
  default: standard
  enable:
    - depguard
    - errorlint
    - gocritic
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    errcheck:
      # A report written to a closed stdout has nowhere to say so.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    depguard:
      rules:
        # go-git is adapted in one package, so its surface never leaks into
        # the checks and a later swap of the git reader touches one file.
        go-git-stays-in-its-adapter:
          files:
            - "$all"
            - "!**/internal/source/gitrepo/**"
          deny:
            - pkg: github.com/go-git
              desc: go-git is read only through internal/source/gitrepo
    revive:
      rules:
        - name: exported
        - name: package-comments

formatters:
  enable:
    - gofumpt
